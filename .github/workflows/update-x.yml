name: update-x-post

# Refreshes data/xpost.js (latest post on @jiansketch) daily.
# No secrets needed — reads the public syndication timeline.
# X 429-blocks GitHub's runner IPs some days, so: three tries a day,
# and the script exits green (keeping the last post) when blocked.
on:
  schedule:
    - cron: "37 1,13,19 * * *" # 01:37 / 13:37 / 19:37 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update xpost data
        run: python tools/update_x.py

      - name: Commit and push if changed
        run: |
          git config user.name "jian-site-bot"
          git config user.email "bot@jiansketch.com"
          git add data/xpost.js assets/img/x_avatar.jpg
          git diff --cached --quiet || git commit -m "x post refresh ($(date -u +%Y-%m-%d))"
          git push
