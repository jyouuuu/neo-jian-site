name: update-x-post

# Refreshes data/xpost.js (latest @jiansketch post) daily. No secrets needed —
# reads X's public syndication timeline AND the Bluesky public API; newest wins.
# X's feed is months-stale and 429-blocks runner IPs, so Bluesky usually
# carries it; if every source is down the script keeps the last post, exits green.
on:
  schedule:
    - cron: "37 1,13,19 * * *" # 01:37 / 13:37 / 19:37 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update xpost data
        run: python tools/update_x.py

      - name: Commit and push if changed
        run: |
          git config user.name "jian-site-bot"
          git config user.email "bot@jiansketch.com"
          git add data/xpost.js assets/img/x_avatar.jpg
          git diff --cached --quiet || git commit -m "x post refresh ($(date -u +%Y-%m-%d))"
          git push
